[project]
name = "skodun"
version = "0.5.0"
requires-python = ">=3.12"
[project.scripts]
skodun = "skodun.cli:entry"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
[tool.pytest.ini_options]
pythonpath = ["src", "."]
