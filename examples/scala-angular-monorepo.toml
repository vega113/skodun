# Example skodun configuration: a Scala (sbt/Play-style) backend with an
# Angular frontend in one repository, Liquibase changelogs under
# src/main/resources/db/changelog/, and CI in scripts/ and .github/.
#
# skodun ships NO repo layout of its own: unconfigured, checklist selection
# only ever picks the `core` section (plus `cross-file`, which is driven by
# docs/review/code-rules.json). This file is a drop-in starting point — copy it
# to <your repo>/.skodun.toml and edit the paths to match your tree:
#
#     cp examples/scala-angular-monorepo.toml /path/to/repo/.skodun.toml
#
# Section names on the right-hand side must match `<name>.md` files in your
# checklist_dir (default docs/review/checklists). skodun knows these:
# core, cross-file, migrations, backend, tests, frontend, tooling.

[defaults]

# Ordered path-prefix -> checklist-section map, matched with str.startswith().
# FIRST MATCH WINS, so entries MUST be ordered longest-prefix-first: a
# changelog path starts with both "src/main/resources/db/changelog/" and
# "src/main/", and the more specific `migrations` section has to win.
checklist_map = [
  ["src/main/resources/db/changelog/", "migrations"],
  ["src/main/", "backend"],
  ["ui/", "frontend"],
  ["scripts/", "tooling"],
  [".github/", "tooling"],
]

# Patterns that mark a path as test code and pull in the `tests` section.
# A pattern ending in "/" is an anchored path prefix; every other pattern is an
# fnmatch glob over the whole path, where "*" also matches "/". So
# "*.spec.ts" means "ends with .spec.ts" and "*test-utils*.ts" means "contains
# test-utils and ends with .ts".
test_path_patterns = [
  "*.spec.ts",
  "*.test.sh",
  "*.test.mjs",
  "*test-utils*.ts",
  "src/test/",
  "integration-tests/src/test/",
  "ui/src/app/testing/",
]

# Path segments that make a change "risky" and schedule the extra security
# pass. Matched WHOLE-SEGMENT and case-insensitively against the "/"-separated
# parts of each changed path, so "auth" fires on `app/auth/Login.scala` but not
# on `app/authentication/` or `app/reauth/`. Keep this list tight: every
# false positive costs a whole extra review call.
security_path_segments = [
  "auth",
  "billing",
  "credits",
  "dao",
  "db",
  "webhook",
]

# Name-shape patterns that also mark a path risky. Each is an fnmatch glob,
# matched case-insensitively against the path with every non-alphanumeric
# character removed — so one pattern covers `TelegramWebhookRouteService.scala`,
# `telegram-webhook.service.ts`, and `telegram_webhook.py` alike.
#
# A pattern with NO "/" is matched against the whole path compacted flat
# (separators removed too), i.e. a pure name test. A pattern CONTAINING "/" is
# matched against the path with each segment compacted but the "/" separators
# kept and a leading "/" prepended, so directory context can be anchored: "*"
# still crosses "/", so the third entry below reads as "under a real
# api/services/ directory, something named like a route service" and does not
# fire on `xapi/services/`.
security_basename_patterns = [
  "*telegramwebhook*",
  "*webhookrouteservice*",
  "*/api/services/*routeservice*",
]

# What "risky surfaces" means in THIS repo, as told to the model on every
# security pass. Each entry is [slot-name, fragment]; the two known slots are:
#
#   surfaces      — completes "…a pull request that touches risky surfaces
#                   (<surfaces>). This is a dedicated security pass…"
#   extra_checks  — the stack-specific bullets appended to the generic
#                   "Look ONLY for concrete security problems" list.
#
# Fragments are inserted verbatim and may contain "\n" to span prompt lines —
# keep lines under ~78 characters so the prompt stays readable. Slots you leave
# out keep skodun's generic wording; a misspelled slot name is a load-time
# error, so a fragment can never go missing silently.
security_prompt_slots = [
  ["surfaces", "auth, public HTTP routes, db/dao, Telegram webhooks,\nbilling, or credits"],
  ["extra_checks", "- webhook validation (Telegram secret token, unsigned public ingress)\n- billing/credits integrity (privilege escalation, free usage)"],
]
