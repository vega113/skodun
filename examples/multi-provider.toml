# Example skodun reviewer configuration: a cross-provider finder with a
# quota-fallback chain, a refuter on a different provider from the finder, and
# a security-pass reviewer. Stack-agnostic on purpose -- like
# examples/scala-angular-monorepo.toml, this file is named for a SHAPE
# (multiple providers in one config), never for a company or project.
#
# Copy the parts you want into <your repo>/.skodun.toml or your global
# ~/.config/skodun/config.toml. Every entry below that is NOT commented out is
# a working example against the shipped adapters -- `skodun providers` exits 0
# against this exact file. The commented blocks show shapes that are either
# deliberately out of scope (`anthropic`) or carry sharp edges worth reading
# about before you turn them on (`google`/`agy`).
#
# Registered providers as of this file:
#   xai        -> grok CLI (subscription)
#   openai     -> codex CLI (subscription) — NOT the HTTP API
#   openai-api -> OpenAI Chat Completions HTTPS (metered; OPENAI_API_KEY)
#   google     -> agy CLI
#   junie      -> junie CLI (macOS Seatbelt-confined empty capsule only)
# `anthropic` is NOT registered -- see the commented `security` block below.
# Run `skodun providers` to check what THIS machine actually has.

# --- auto-route: let skodun pick which finder heads an un-pinned review ----
#
# Without this table, every review that does NOT pass `--reviewer` starts at
# the FIRST enabled `finder` below -- so on a machine running several agents
# they all pile into one provider's FIFO while the others sit idle. `mode =
# "auto"` scores the pool at head resolution instead, from what the store can
# actually see: free `provider:<id>` slots, queue depth, and `provider_state`
# quota blackouts.
#
# `off` is the SHIPPED DEFAULT. It is `auto` here because this file is the
# multi-provider example and auto-routing is the reason to have more than one
# finder configured -- a single-provider config gains nothing from it.
#
# Three properties worth knowing before you turn it on:
#
#   * A PIN STILL WINS, in every mode. `--reviewer finder-openai` (MCP:
#     `{"reviewer": "finder-openai"}`) is absolute -- that is what makes it
#     usable for a deliberate second opinion.
#   * SCORED ONCE, at the start of the run. It does not re-route while waiting
#     for a slot; once a head is chosen, that entry's own `fallbacks` chain
#     handles failure exactly as it does today.
#   * IT CHANGES NOTHING WHILE NOTHING IS BUSY. Ties go to the entry you listed
#     first, so with every provider idle `auto` heads the same entry `off`
#     would have. It deviates only once load actually differs.
#   * EXTRA PASSES ARE NOT ROUTED. The security, skeptic, refuter and
#     integration passes still pick by ROLE, so a refuter you deliberately put
#     on another provider stays there.
#
# Every review records `routed_reviewer` and `route_reason` (`pinned`,
# `config-finder`, `auto:free`, `auto:free+cross`, `auto:wait`, …) on its
# artifact, so a spread can be explained after the fact.
#
# Env override, for turning this off on one machine without editing the file:
#   export SKODUN_ROUTING_MODE=off        # or auto
[routing]
mode = "auto"

# The entries the router may choose between, by NAME. Omit the key entirely to
# mean "every enabled role = finder entry", which is what most configs want --
# this list is here to show the shape, and because an explicit pool is how you
# keep a finder configured (for pinning) while excluding it from automatic
# selection -- and that exclusion holds even when the pool is fully blacked
# out, so an entry you kept out never heads an automatic run.
#
# Names are validated at load: one that does not exist, is disabled, or is not
# a finder is a loud config error, not a silently smaller pool. So is a pooled
# entry whose provider has no adapter, refused in preflight rather than routed
# around -- a typo found only on the runs where the other providers happened to
# be busy is a typo not found at all.
pool = ["finder", "finder-openai"]

# Soft preference for a finder whose provider FAMILY differs from the calling
# client's (`--client-family xai`, MCP `client_family`, or
# $SKODUN_CLIENT_FAMILY). Families: xai / openai (both the codex CLI and
# openai-api -- two doors to the same models) / google / junie.
#
# SOFT is the whole design. It is worth a tie-break between two providers that
# are equally free; it never outranks a free slot, and it never excludes the
# last available family -- a single-provider machine still gets reviewed.
# Default true; set false if you would rather score on availability alone.
cross_model = true

# --- the finder, with a same-role fallback on a different provider ---------
#
# `fallbacks` is tried, in order, only when the head reviewer's OWN attempt
# classifies "unavailable" (binary missing, auth failure, an unknown model
# id, or a cached provider-wide quota outage) -- never merely because it found
# nothing wrong, and never on a "degraded" (truncated/corrupted) run, which
# has its own retry budget instead. A fallback member's role field is not
# consulted while it stands in for the head: what runs is that entry's own
# provider/model/effort, in the role the HEAD was serving.
#
# `name` is not decoration once there is more than one entry: it is how a
# fallback chain refers to a member, and how ONE review asks for a different
# head -- `skodun review --reviewer finder-openai` (MCP: the `review` tool's
# `reviewer` argument) starts this run's chain at that entry instead of the
# first enabled `finder`. The chosen entry's own `fallbacks` still apply, and
# the extra passes below still choose by ROLE. A name that is not configured,
# is disabled, or has no registered adapter is refused before anything runs.
[[reviewers]]
name      = "finder"
provider  = "xai"
model     = "grok-4.5"        # verify with `grok models` -- ids are retired without notice
effort    = "high"
role      = "finder"
fallbacks = ["finder-openai"]  # up to 3 names; each must exist, be enabled, and not cycle

[[reviewers]]
name     = "finder-openai"
provider = "openai"
model    = "gpt-5.4-mini"     # the codex CLI has no `list models` subcommand -- see README
effort   = "medium"
role     = "finder"

# --- the refuter: a DIFFERENT provider re-examines the finder's findings ---
#
# Scheduled only when the finder came back trustworthy WITH findings. This is
# annotation-only: it never dismisses anything and the gate never reads its
# verdicts. The only way an annotation becomes a dismissal is a human running
# `skodun triage --adopt-refuter <review-id> <finding-index>`, one finding at
# a time -- there is no bulk form. Putting the refuter on the SAME provider as
# the finder is allowed (the config loads fine) but defeats the point: a
# model re-examining its own work tends to agree with itself, and
# `triage --adopt-refuter` prints a WARNING when it detects this.
#
# GIVE IT A FALLBACK -- because of the SKEPTIC, not because of the refuter.
# This entry serves two passes, and they treat a dead provider differently:
#
#   refuter pass  annotation-only. `merge_refuter_pass` cannot make a review
#                 untrustworthy, so a refuter whose provider is unavailable
#                 leaves the review exactly as the finder left it. Nothing to
#                 protect against here.
#   skeptic pass  runs on a trustworthy CLEAN finder, and a pass that produces
#                 NOTHING at all -- quota, auth, a missing binary -- goes
#                 through `merge_failed_extra_pass`, which demotes. So an
#                 outage on this entry costs you the clean verdict the finder
#                 already earned.
#
# Observed 2026-08-03: this entry on a metered provider whose key the MCP
# server process could not see turned clean grok reviews into untrustworthy
# ones, gate 2, until it was given somewhere to hop to.
#
#     fallbacks = ["finder"]
#
# That is same-family as the finder on the runs where it fires, which is the
# thing this pass exists to avoid -- but only on the runs where the alternative
# was losing the finder's verdict. `fallbacks` hop on `unavailable` (quota,
# auth, missing binary, unknown model), which is exactly the outage this
# covers.
[[reviewers]]
name      = "refuter"
provider  = "openai"
model     = "gpt-5.4"
role      = "refuter"
fallbacks = ["finder"]

# --- security pass: an anthropic reviewer, NOT a working example -----------
#
# `anthropic` has no registered adapter, and this is a deliberate scope
# decision rather than an unfinished one: driving the `claude` CLI HEADLESSLY
# bills as API usage rather than drawing on a Claude subscription. skodun
# exists to reuse the CLI subscriptions you already pay for -- that is why it
# shells out to installed binaries instead of linking a provider SDK -- so an
# adapter that moves you from flat-rate to metered billing to run the same
# review works against the point of the tool. Do not expect this block to
# start working; it is here to show the shape, not to be uncommented.
#
# Verify with `skodun providers`: a config naming `anthropic` loads, but the
# listing reports it FAILED and exits 1, and an actual review against it fails
# closed the same way any unresolvable provider does.
#
# `max_cost_usd` DOES validate today (must be a finite, strictly positive,
# non-boolean number) even though no shipped adapter reads it -- a budget cap
# is provider-neutral, so it is kept for whichever metered adapter needs it.
#
# [[reviewers]]
# name         = "security"
# provider     = "anthropic"
# model        = "<check your anthropic CLI's own listing command>"
# role         = "security"
# max_cost_usd = 2.0

# --- google (agy): works, but read this before you turn it on --------------
#
# Two properties of the `agy` CLI are worth knowing before you configure
# `google` as a reviewer, because both fail LOUDLY and CLOSED rather than
# silently -- but only once you have already burned an attempt on them:
#
# 1. Effort is entangled with the model id, and `agy models` (the command a
#    config author actually runs) prints ONLY effort-suffixed ids such as
#    "gemini-3.6-flash-high" -- never the bare "gemini-3.6-flash" a base id
#    would need. Only two shapes work:
#      (a) a SUFFIXED id (one `agy models` actually lists), with `effort`
#          left unset or set to "none" -- the suffix already says the level;
#      (b) a BASE id (NOT listed by `agy models` -- you have to know it),
#          with `effort` set to the matching level ("low"/"medium"/"high").
#    A suffixed id combined with ANY other `effort` value is a guaranteed
#    rc-1 "invalid model selection" refusal on every single attempt.
#
# 2. This CLI has no prompt-file flag and does not read stdin in print mode,
#    so skodun passes the reviewed diff as a command-line ARGUMENT. On a
#    shared machine that diff is visible in `ps` (and on default Linux,
#    world-readable at /proc/<pid>/cmdline) for the life of the review call.
#    It also caps how large a prompt this provider can be handed at all: the
#    argv size guard here is 122,880 bytes (120 KB), well under the
#    `max_diff_bytes` default of 400,000. You do NOT have to lower the global
#    for it -- the adapter DECLARES that ceiling (`prompt_limit()`), and the
#    planner takes the smaller of it and your configured number, per reviewer.
#    So this entry is budgeted to what it can carry while a `codex`/`grok`
#    entry beside it keeps the whole envelope, and a large change simply
#    splits into more, smaller batches for this provider.
#
#    A prompt that still does not fit -- a chain can span providers, and one
#    sized for a file-fed head may reach this one as a fallback -- is refused
#    with a clear "too large to pass on the command line" error rather than a
#    kernel-level failure, classifies `unavailable`, and the chain moves to the
#    next entry. An exhausted chain is still a failure.
#
# 3. `max_diff_bytes` may also be set PER REVIEWER, on the entry itself, when
#    you want one model budgeted differently without moving the global:
#
#        [[reviewers]]
#        name           = "finder-openai"
#        provider       = "openai"
#        model          = "gpt-5.4"
#        max_diff_bytes = 600000       # this entry only
#
#    It replaces the global for that entry, in either direction, and is still
#    capped by the adapter's own ceiling -- a ceiling is what the CLI can
#    physically accept, and no configuration raises it.
#
# [[reviewers]]
# name     = "finder-google"
# provider = "google"
# model    = "gemini-3.6-flash-high"   # shape (a): suffixed id, no `effort` line
# role     = "finder"
#
# # shape (b) instead of the above:
# # model  = "gemini-3.6-flash"        # base id -- NOT in `agy models`' own listing
# # effort = "high"                    # required, and must match

# --- junie (JetBrains CLI): macOS only, empty-capsule confinement ----------
#
# The adapter never points junie at your real worktree. Every attempt runs in
# a temporary empty capsule under a deny-by-default macOS Seatbelt profile,
# with foreign provider/operator credentials stripped. Off macOS the adapter
# refuses before inference (`unavailable`) rather than running unconfined.
# Prefer this as a tertiary fallback, not as the only finder, unless you are
# on macOS with junie installed and authenticated.
#
# [[reviewers]]
# name     = "finder-junie"
# provider = "junie"
# model    = "gpt-5.6-luna"   # must be an id this junie install serves
# effort   = "high"           # low | medium | high; `max` is refused
# role     = "finder"

# --- openai-api (metered HTTP; NOT the codex CLI) --------------------------
#
# Distinct provider id: `openai-api`. Key from process env only (BYOK):
#   export OPENAI_API_KEY=sk-...          # or SKODUN_OPENAI_API_KEY
# MCP clients: put the same vars on the skodun mcp server `env` block
# (never commit the key). Spend is capped **per UTC day** (default $10), not
# lifetime: SKODUN_OPENAI_API_SPEND_LIMIT_USD_PER_DAY=10
# Full client notes: examples/fragments/openai-api.md
#
# [[reviewers]]
# name     = "finder-openai-api"
# provider = "openai-api"
# model    = "gpt-5.6-luna"    # any model id the OpenAI API accepts
# effort   = "medium"
# role     = "finder"
# max_cost_usd = 0.50
